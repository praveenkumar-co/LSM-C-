name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    env:
      CXX: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - name: Compiler version
        run: $CXX --version
      - name: make test-quick
        run: make test-quick
      - name: make asan
        run: make asan

  tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - name: Compiler version
        run: $CXX --version
      - name: make tsan
        run: make tsan
